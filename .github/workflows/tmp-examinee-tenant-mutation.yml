name: Temporary examinee tenant mutation test

on:
  push:
    branches:
      - codex/48-examinees

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foundation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MYSQL_TEST_URL: mysql://root:root@127.0.0.1:3306/foundation_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/48-examinees
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
      - name: Inject tenant-filter mutation locally
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/adapters/mysql/src/examinee-repository.ts')
          text = path.read_text()
          old = '       WHERE e.id = ? AND e.tenant_id = ? AND e.deleted_at IS NULL\n       LIMIT 1`,'
          new = '       WHERE e.id = ? AND (e.tenant_id = ? OR 1=1) AND e.deleted_at IS NULL\n       LIMIT 1`,'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one getExamineeWith marker, got {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: corepack pnpm build
      - name: Require cross-tenant negative test to kill mutation
        run: |
          set +e
          corepack pnpm --filter @server-foundation/mysql-adapter exec vitest run test/examinee-repository.integration.test.ts
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Tenant mutation survived: negative tests did not detect OR 1=1."
            exit 1
          fi
          echo "Tenant mutation killed as required: targeted integration test failed under OR 1=1."

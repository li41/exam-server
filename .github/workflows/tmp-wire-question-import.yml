name: Temporary wire question import

on:
  push:
    branches:
      - codex/44-question-import

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/44-question-import
          fetch-depth: 0

      - name: Patch router and server wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))

          routes = Path("apps/api/src/question-bank-routes.ts")
          replace_once(
              routes,
              '  QuestionBankService,\n  QuestionStructureService,\n',
              '  QuestionBankService,\n  QuestionImportService,\n  QuestionStructureService,\n',
          )
          replace_once(
              routes,
              '  QuestionBankRepository,\n  QuestionStructureRepository,\n',
              '  QuestionBankRepository,\n  QuestionImportRepository,\n  QuestionStructureRepository,\n',
          )
          replace_once(
              routes,
              'import type { Logger } from "./logger.js";\n',
              'import type { Logger } from "./logger.js";\nimport {\n  importQuestionWorkbookFromRequest,\n  questionImportTemplateResponse,\n} from "./question-import-handler.js";\n',
          )
          replace_once(
              routes,
              '  repository: QuestionBankRepository;\n  structureRepository?: QuestionStructureRepository;\n',
              '  repository: QuestionBankRepository;\n  importRepository?: QuestionImportRepository;\n  structureRepository?: QuestionStructureRepository;\n',
          )
          replace_once(
              routes,
              '  const service = new QuestionBankService(dependencies.repository);\n  const structureService = dependencies.structureRepository\n',
              '  const service = new QuestionBankService(dependencies.repository);\n  const importService = dependencies.importRepository\n    ? new QuestionImportService(dependencies.importRepository)\n    : undefined;\n  const structureService = dependencies.structureRepository\n',
          )
          replace_once(
              routes,
              '  const requireStructureService = (): QuestionStructureService => {\n',
              '  const requireImportService = (): QuestionImportService => {\n    if (!importService) {\n      throw new CapabilityMissingError("question import");\n    }\n    return importService;\n  };\n\n  const requireStructureService = (): QuestionStructureService => {\n',
          )
          replace_once(
              routes,
              '    "/question-categories/*",\n    "/question-clusters",\n',
              '    "/question-categories/*",\n    "/question-import",\n    "/question-import/*",\n    "/question-clusters",\n',
          )
          replace_once(
              routes,
              '  api.get(\n    "/questions",\n',
              '''  api.get("/question-import/template", () => questionImportTemplateResponse());\n\n  api.post("/question-import", async (context) => {\n    const result = await importQuestionWorkbookFromRequest(\n      context.req.raw,\n      requireImportService(),\n      scopeFor(context),\n    );\n    return result.ok\n      ? context.json({ imported: result.imported, errors: result.errors }, 201)\n      : context.json({ imported: 0, errors: result.errors }, 400);\n  });\n\n  api.get(\n    "/questions",\n''',
          )

          server = Path("apps/api/src/server.ts")
          replace_once(
              server,
              '  MySqlQuestionBankRepository,\n  MySqlQuestionStructureRepository,\n',
              '  MySqlQuestionBankRepository,\n  MySqlQuestionImportRepository,\n  MySqlQuestionStructureRepository,\n',
          )
          replace_once(
              server,
              '  createInMemoryQuestionBankRepository,\n  createInMemoryQuestionStructureRepository,\n',
              '  createInMemoryQuestionBankRepository,\n  createInMemoryQuestionImportRepository,\n  createInMemoryQuestionStructureRepository,\n',
          )
          replace_once(
              server,
              '  const questionStructureRepository = pool\n',
              '  const questionImportRepository = pool\n    ? new MySqlQuestionImportRepository(pool)\n    : createInMemoryQuestionImportRepository(questionBankRepository);\n  const questionStructureRepository = pool\n',
          )
          replace_once(
              server,
              '    repository: questionBankRepository,\n    structureRepository: questionStructureRepository,\n',
              '    repository: questionBankRepository,\n    importRepository: questionImportRepository,\n    structureRepository: questionStructureRepository,\n',
          )
          replace_once(
              server,
              '    questionBank: "enabled",\n    questionStructures: "enabled",\n',
              '    questionBank: "enabled",\n    questionImport: "enabled",\n    questionStructures: "enabled",\n',
          )
          PY

      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/question-bank-routes.ts apps/api/src/server.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "wire question import API"
            git push origin HEAD:codex/44-question-import
          fi

name: Temporary format question import

on:
  push:
    branches:
      - codex/44-question-import

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/44-question-import
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Format exact issue files
        run: |
          corepack pnpm exec prettier --write \
            apps/api/src/question-import-handler.ts \
            apps/api/src/question-import.ts \
            apps/api/test/question-import.test.ts \
            packages/adapters/mysql/src/question-import-repository.ts \
            packages/adapters/mysql/test/question-import-repository.integration.test.ts \
            packages/testing/src/fake-question-import-repository.ts \
            pnpm-lock.yaml
      - name: Commit exact formatted files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/api/src/question-import-handler.ts \
            apps/api/src/question-import.ts \
            apps/api/test/question-import.test.ts \
            packages/adapters/mysql/src/question-import-repository.ts \
            packages/adapters/mysql/test/question-import-repository.integration.test.ts \
            packages/testing/src/fake-question-import-repository.ts \
            pnpm-lock.yaml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "format question import implementation"
            git push origin HEAD:codex/44-question-import
          fi

name: Temporary fix examinee narrowing

on:
  push:
    branches:
      - codex/48-examinees

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/48-examinees
      - name: Apply exact narrowing fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'packages/testing/src/fake-examinee-repository.ts': [
              (
                '''    if (!group) {\n      validationError(`Examinee group ${field} \\"${id}\\" does not exist.`);\n    }\n    return group;''',
                '''    if (!group) {\n      throw new DomainError(\n        "validation_error",\n        `Examinee group ${field} \\"${id}\\" does not exist.`,\n      );\n    }\n    return group;''',
              ),
            ],
            'packages/adapters/mysql/src/examinee-repository.ts': [
              (
                '''    if (!parent) {\n      validationError(`Examinee group parentId \\"${parentId}\\" does not exist.`);\n    }\n    if (parent.parent_id !== null) {''',
                '''    if (!parent) {\n      throw new DomainError(\n        "validation_error",\n        `Examinee group parentId \\"${parentId}\\" does not exist.`,\n      );\n    }\n    if (parent.parent_id !== null) {''',
              ),
            ],
          }
          for path, pairs in replacements.items():
            p = Path(path)
            text = p.read_text()
            for old, new in pairs:
              if text.count(old) != 1:
                raise SystemExit(f'{path}: marker count {text.count(old)}')
              text = text.replace(old, new, 1)
            p.write_text(text)
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec prettier --write \
            packages/testing/src/fake-examinee-repository.ts \
            packages/adapters/mysql/src/examinee-repository.ts
      - name: Commit exact files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/testing/src/fake-examinee-repository.ts \
            packages/adapters/mysql/src/examinee-repository.ts
          git diff --cached --check
          git commit -m "fix examinee type narrowing"
          git push origin HEAD:codex/48-examinees

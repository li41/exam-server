name: Temporary fix examinee narrowing

on:
  push:
    branches:
      - codex/48-examinees

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/48-examinees
      - name: Apply exact narrowing fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: marker count {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'packages/testing/src/fake-examinee-repository.ts',
              '      validationError(`Examinee group ${field} "${id}" does not exist.`);',
              '''      throw new DomainError(
                "validation_error",
                `Examinee group ${field} "${id}" does not exist.`,
              );''',
          )
          replace_once(
              'packages/adapters/mysql/src/examinee-repository.ts',
              '      validationError(`Examinee group parentId "${parentId}" does not exist.`);',
              '''      throw new DomainError(
                "validation_error",
                `Examinee group parentId "${parentId}" does not exist.`,
              );''',
          )
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec prettier --write \
            packages/testing/src/fake-examinee-repository.ts \
            packages/adapters/mysql/src/examinee-repository.ts
      - name: Commit exact files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/testing/src/fake-examinee-repository.ts \
            packages/adapters/mysql/src/examinee-repository.ts
          git diff --cached --check
          git commit -m "fix examinee type narrowing"
          git push origin HEAD:codex/48-examinees

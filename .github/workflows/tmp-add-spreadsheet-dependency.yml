name: Temporary add spreadsheet dependency

on:
  push:
    branches:
      - codex/44-question-import

permissions:
  contents: write

jobs:
  add-dependency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/44-question-import
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Add spreadsheet dependency
        run: corepack pnpm --filter @server-foundation/api add @e965/xlsx@latest

      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level=high

      - name: Commit dependency files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "add spreadsheet parser dependency"
            git push origin HEAD:codex/44-question-import
          fi

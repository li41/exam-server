name: Temporary wire test booklets

on:
  push:
    branches:
      - codex/45-test-booklets

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/45-test-booklets
      - name: Apply exact feature wiring
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected marker once, got {count}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))

          # API-contract export.
          replace_once(
              'packages/api-contracts/src/index.ts',
              'export * from "./question-structures.js";\n',
              'export * from "./question-structures.js";\nexport * from "./test-booklets.js";\n',
          )

          # Migration registry; migration is registered only, never applied by this workflow.
          replace_once(
              'packages/adapters/mysql/src/migrate.ts',
              '''  {\n    id: "007_question_structures",\n    file: new URL("../schema/007_question_structures.sql", import.meta.url),\n  },\n];''',
              '''  {\n    id: "007_question_structures",\n    file: new URL("../schema/007_question_structures.sql", import.meta.url),\n  },\n  {\n    id: "008_test_booklets",\n    file: new URL("../schema/008_test_booklets.sql", import.meta.url),\n  },\n];''',
          )

          route = 'apps/api/src/question-bank-routes.ts'
          replace_once(
              route,
              '''  CreateQuestionGroupSchema,\n  CreateQuestionSchema,\n  DeleteQuestionCategoryQuerySchema,''',
              '''  CreateQuestionGroupSchema,\n  CreateQuestionSchema,\n  CreateTestBookletSchema,\n  DeleteQuestionCategoryQuerySchema,''',
          )
          replace_once(
              route,
              '''  DeleteQuestionQuerySchema,\n  DeleteQuestionStructureQuerySchema,\n  LEGACY_API_PREFIX,''',
              '''  DeleteQuestionQuerySchema,\n  DeleteQuestionStructureQuerySchema,\n  DeleteTestBookletQuerySchema,\n  LEGACY_API_PREFIX,''',
          )
          replace_once(
              route,
              '''  QuestionGroupListQuerySchema,\n  QuestionListQuerySchema,\n  UpdateQuestionCategorySchema,''',
              '''  QuestionGroupListQuerySchema,\n  QuestionListQuerySchema,\n  TestBookletListQuerySchema,\n  UpdateQuestionCategorySchema,''',
          )
          replace_once(
              route,
              '''  UpdateQuestionGroupSchema,\n  UpdateQuestionSchema,\n} from "@server-foundation/api-contracts";''',
              '''  UpdateQuestionGroupSchema,\n  UpdateQuestionSchema,\n  UpdateTestBookletSchema,\n} from "@server-foundation/api-contracts";''',
          )
          replace_once(
              route,
              '''  QuestionImportService,\n  QuestionStructureService,\n  UnauthorizedError,''',
              '''  QuestionImportService,\n  QuestionStructureService,\n  TestBookletService,\n  UnauthorizedError,''',
          )
          replace_once(
              route,
              '''  QuestionImportRepository,\n  QuestionStructureRepository,\n} from "@server-foundation/domain";''',
              '''  QuestionImportRepository,\n  QuestionStructureRepository,\n  TestBookletRepository,\n} from "@server-foundation/domain";''',
          )
          replace_once(
              route,
              '''  importRepository?: QuestionImportRepository;\n  structureRepository?: QuestionStructureRepository;\n  authenticationService?: AuthenticationService;''',
              '''  importRepository?: QuestionImportRepository;\n  structureRepository?: QuestionStructureRepository;\n  bookletRepository?: TestBookletRepository;\n  authenticationService?: AuthenticationService;''',
          )
          replace_once(
              route,
              '''  const structureService = dependencies.structureRepository\n    ? new QuestionStructureService(dependencies.structureRepository)\n    : undefined;\n\n  const requireImportService''',
              '''  const structureService = dependencies.structureRepository\n    ? new QuestionStructureService(dependencies.structureRepository)\n    : undefined;\n  const bookletService = dependencies.bookletRepository\n    ? new TestBookletService(dependencies.bookletRepository)\n    : undefined;\n\n  const requireImportService''',
          )
          replace_once(
              route,
              '''  const requireStructureService = (): QuestionStructureService => {\n    if (!structureService) {\n      throw new CapabilityMissingError("question structures");\n    }\n    return structureService;\n  };\n\n  const authenticate''',
              '''  const requireStructureService = (): QuestionStructureService => {\n    if (!structureService) {\n      throw new CapabilityMissingError("question structures");\n    }\n    return structureService;\n  };\n\n  const requireBookletService = (): TestBookletService => {\n    if (!bookletService) {\n      throw new CapabilityMissingError("test booklets");\n    }\n    return bookletService;\n  };\n\n  const authenticate''',
          )
          replace_once(
              route,
              '''    "/question-groups",\n    "/question-groups/*",\n  ]) {''',
              '''    "/question-groups",\n    "/question-groups/*",\n    "/test-booklets",\n    "/test-booklets/*",\n  ]) {''',
          )

          booklet_routes = r'''
  api.get(
    "/test-booklets",
    zValidator("query", TestBookletListQuerySchema, (result, context) => {
      if (!result.success) {
        return validationError(context, "Invalid test booklet query parameters.");
      }
    }),
    async (context) =>
      context.json(
        await requireBookletService().listBooklets(
          context.req.valid("query"),
          scopeFor(context),
        ),
      ),
  );

  api.get("/test-booklets/:id", async (context) =>
    context.json(
      await requireBookletService().getBooklet(
        context.req.param("id"),
        scopeFor(context),
      ),
    ),
  );

  api.post(
    "/test-booklets",
    zValidator("json", CreateTestBookletSchema, (result, context) => {
      if (!result.success) {
        return validationError(context, "Invalid test booklet payload.");
      }
    }),
    async (context) =>
      context.json(
        await requireBookletService().createBooklet(
          context.req.valid("json"),
          scopeFor(context),
        ),
        201,
      ),
  );

  api.patch(
    "/test-booklets/:id",
    zValidator("json", UpdateTestBookletSchema, (result, context) => {
      if (!result.success) {
        return validationError(context, "Invalid test booklet payload.");
      }
    }),
    async (context) =>
      context.json(
        await requireBookletService().updateBooklet(
          context.req.param("id"),
          context.req.valid("json"),
          scopeFor(context),
        ),
      ),
  );

  api.delete(
    "/test-booklets/:id",
    zValidator("query", DeleteTestBookletQuerySchema, (result, context) => {
      if (!result.success) {
        return validationError(context, "A valid version is required.");
      }
    }),
    async (context) => {
      await requireBookletService().softDeleteBooklet(
        context.req.param("id"),
        context.req.valid("query").version,
        scopeFor(context),
      );
      return context.body(null, 204);
    },
  );

  api.post("/test-booklets/:id/duplicate", async (context) =>
    context.json(
      await requireBookletService().duplicateBooklet(
        context.req.param("id"),
        scopeFor(context),
      ),
      201,
    ),
  );
'''
          replace_once(route, '\n  return api;\n};', booklet_routes + '\n  return api;\n};')

          server = 'apps/api/src/server.ts'
          replace_once(
              server,
              '''  MySqlQuestionImportRepository,\n  MySqlQuestionStructureRepository,\n  MySqlUserRepository,''',
              '''  MySqlQuestionImportRepository,\n  MySqlQuestionStructureRepository,\n  MySqlTestBookletRepository,\n  MySqlUserRepository,''',
          )
          replace_once(
              server,
              '''  createInMemoryQuestionImportRepository,\n  createInMemoryQuestionStructureRepository,\n} from "@server-foundation/testing";''',
              '''  createInMemoryQuestionImportRepository,\n  createInMemoryQuestionStructureRepository,\n  createInMemoryTestBookletRepository,\n} from "@server-foundation/testing";''',
          )
          replace_once(
              server,
              '''  const questionStructureRepository = pool\n    ? new MySqlQuestionStructureRepository(pool)\n    : createInMemoryQuestionStructureRepository(questionBankRepository);\n  const localBlobStorage''',
              '''  const questionStructureRepository = pool\n    ? new MySqlQuestionStructureRepository(pool)\n    : createInMemoryQuestionStructureRepository(questionBankRepository);\n  const testBookletRepository = pool\n    ? new MySqlTestBookletRepository(pool)\n    : createInMemoryTestBookletRepository(\n        questionBankRepository,\n        questionStructureRepository,\n      );\n  const localBlobStorage''',
          )
          replace_once(
              server,
              '''    importRepository: questionImportRepository,\n    structureRepository: questionStructureRepository,\n    authenticationService,''',
              '''    importRepository: questionImportRepository,\n    structureRepository: questionStructureRepository,\n    bookletRepository: testBookletRepository,\n    authenticationService,''',
          )
          replace_once(
              server,
              '''    questionImport: "enabled",\n    questionStructures: "enabled",\n    auditLog:''',
              '''    questionImport: "enabled",\n    questionStructures: "enabled",\n    testBooklets: "enabled",\n    auditLog:''',
          )

          # Contract manifest: additive v1 entries only.
          contract_path = Path('contracts/api-v1.json')
          contract = json.loads(contract_path.read_text())
          new_endpoints = [
              {"method": "GET", "path": "/api/v1/test-booklets", "authenticated": True, "idempotent": False},
              {"method": "GET", "path": "/api/v1/test-booklets/:id", "authenticated": True, "idempotent": False},
              {"method": "POST", "path": "/api/v1/test-booklets", "authenticated": True, "idempotent": True},
              {"method": "PATCH", "path": "/api/v1/test-booklets/:id", "authenticated": True, "idempotent": True},
              {"method": "DELETE", "path": "/api/v1/test-booklets/:id", "authenticated": True, "idempotent": True},
              {"method": "POST", "path": "/api/v1/test-booklets/:id/duplicate", "authenticated": True, "idempotent": True},
          ]
          existing = {(e['method'], e['path']) for e in contract['endpoints']}
          if any((e['method'], e['path']) in existing for e in new_endpoints):
              raise SystemExit('test-booklet endpoint already present unexpectedly')
          file_index = next(i for i, e in enumerate(contract['endpoints']) if e['path'].startswith('/api/v1/files/'))
          contract['endpoints'][file_index:file_index] = new_endpoints
          contract['closedEnums']['TestBookletStatus'] = ['enabled', 'disabled']
          contract['requestSchemas']['CreateTestBooklet'] = {
              'subjectId': {'type': 'nullable-string', 'required': False},
              'categoryId': {'type': 'nullable-string', 'required': False},
              'code': {'type': 'string', 'required': True},
              'name': {'type': 'string', 'required': True},
              'description': {'type': 'nullable-string', 'required': False},
              'status': {'type': 'TestBookletStatus', 'required': False},
              'groupIds': {'type': 'string-array', 'required': False},
          }
          contract['requestSchemas']['UpdateTestBooklet'] = {
              'subjectId': {'type': 'nullable-string', 'required': False},
              'categoryId': {'type': 'nullable-string', 'required': False},
              'code': {'type': 'string', 'required': False},
              'name': {'type': 'string', 'required': False},
              'description': {'type': 'nullable-string', 'required': False},
              'status': {'type': 'TestBookletStatus', 'required': False},
              'groupIds': {'type': 'string-array', 'required': False},
              'version': {'type': 'positive-integer', 'required': True},
          }
          contract['requestSchemas']['DeleteTestBookletQuery'] = {
              'version': {'type': 'positive-integer', 'required': True},
          }
          contract['responseSchemas']['TestBooklet'] = {
              'id': {'type': 'string', 'required': True},
              'tenantId': {'type': 'string', 'required': True},
              'createdBy': {'type': 'string', 'required': True},
              'subjectId': {'type': 'nullable-string', 'required': True},
              'categoryId': {'type': 'nullable-string', 'required': True},
              'code': {'type': 'string', 'required': True},
              'name': {'type': 'string', 'required': True},
              'description': {'type': 'nullable-string', 'required': True},
              'status': {'type': 'TestBookletStatus', 'required': True},
              'version': {'type': 'positive-integer', 'required': True},
              'items': {'type': 'test-booklet-item-array', 'required': True},
              'createdAt': {'type': 'iso-string', 'required': True},
              'updatedAt': {'type': 'iso-string', 'required': True},
              'deletedAt': {'type': 'nullable-iso-string', 'required': True},
          }
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n')

          fixture_path = Path('contracts/api-v1-fixtures.json')
          fixtures = json.loads(fixture_path.read_text())
          for name in ['CreateTestBookletSchema', 'UpdateTestBookletSchema', 'DeleteTestBookletQuerySchema', 'TestBookletSchema']:
              if name in fixtures:
                  raise SystemExit(f'{name} fixture already exists unexpectedly')
          fixtures['CreateTestBookletSchema'] = {
              'subjectId': None,
              'categoryId': None,
              'code': 'BOOK-001',
              'name': 'Fixture booklet',
              'description': None,
              'status': 'enabled',
              'groupIds': ['group-1'],
          }
          fixtures['UpdateTestBookletSchema'] = {'name': 'Updated fixture booklet', 'version': 1}
          fixtures['DeleteTestBookletQuerySchema'] = {'version': '1'}
          fixtures['TestBookletSchema'] = {
              'id': 'booklet-1',
              'tenantId': 'company-opaque',
              'createdBy': 'user-1',
              'subjectId': None,
              'categoryId': None,
              'code': 'BOOK-001',
              'name': 'Fixture booklet',
              'description': None,
              'status': 'enabled',
              'version': 1,
              'items': [{'groupId': 'group-1', 'position': 0, 'available': True}],
              'createdAt': '2026-08-16T00:00:00.000Z',
              'updatedAt': '2026-08-16T00:00:00.000Z',
              'deletedAt': None,
          }
          fixture_path.write_text(json.dumps(fixtures, ensure_ascii=False, indent=2) + '\n')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec prettier --write \
            packages/api-contracts/src/index.ts \
            packages/adapters/mysql/src/migrate.ts \
            apps/api/src/question-bank-routes.ts \
            apps/api/src/server.ts \
            contracts/api-v1.json \
            contracts/api-v1-fixtures.json
      - name: Commit exact wiring files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/api-contracts/src/index.ts \
            packages/adapters/mysql/src/migrate.ts \
            apps/api/src/question-bank-routes.ts \
            apps/api/src/server.ts \
            contracts/api-v1.json \
            contracts/api-v1-fixtures.json
          git diff --cached --check
          git commit -m "wire test booklet API"
          git push origin HEAD:codex/45-test-booklets

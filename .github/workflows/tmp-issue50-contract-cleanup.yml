name: tmp issue 50 contract cleanup

on:
  push:
    branches:
      - codex/50-examinee-import

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'retry issue 50 contract cleanup within endpoints'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/50-examinee-import
          fetch-depth: 0

      - name: Restore base formatting and add only issue 50 contract entries
        env:
          BASE_SHA: 36d67dc1aa7a8be9612524f3c84fac7c3517220e
        run: |
          git show "$BASE_SHA:contracts/api-v1.json" > contracts/api-v1.json
          git show "$BASE_SHA:contracts/api-v1-fixtures.json" > contracts/api-v1-fixtures.json
          python3 - <<'PY'
          from pathlib import Path

          def insert_before_unique_line(path, needle, lines):
              p = Path(path)
              current = p.read_text().splitlines(keepends=True)
              matches = [i for i, line in enumerate(current) if line.strip() == needle]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: {needle!r} matched {len(matches)}, expected 1")
              index = matches[0]
              current[index:index] = [line + "\n" for line in lines]
              p.write_text("".join(current))

          api = Path("contracts/api-v1.json")
          lines = api.read_text().splitlines(keepends=True)
          closed_enums = next(i for i, line in enumerate(lines) if line.strip() == '"closedEnums": {')
          matches = [
              i for i, line in enumerate(lines[:closed_enums])
              if line.strip() == '"path": "/api/v1/examinees",'
          ]
          if len(matches) != 1:
              raise SystemExit(f"endpoint-section examinees path matched {len(matches)}, expected 1")
          path_index = matches[0]
          object_start = path_index - 2
          if lines[object_start].strip() != "{":
              raise SystemExit("could not locate examinees endpoint object start")
          lines[object_start:object_start] = [
              "    {\n",
              '      "method": "POST",\n',
              '      "path": "/api/v1/examinee-import",\n',
              '      "authenticated": true,\n',
              '      "idempotent": true\n',
              "    },\n",
          ]
          api.write_text("".join(lines))

          insert_before_unique_line(
              "contracts/api-v1.json",
              '"FileMetadata": {',
              [
                  '    "ExamineeImport": {',
                  '      "imported": { "type": "nonnegative-integer", "required": true },',
                  '      "updated": { "type": "nonnegative-integer", "required": true },',
                  '      "errors": { "type": "examinee-import-issue-array", "required": true }',
                  '    },',
              ],
          )

          insert_before_unique_line(
              "contracts/api-v1-fixtures.json",
              '"FileMetadataSchema": {',
              [
                  '  "ExamineeImportIssueSchema": {',
                  '    "sheet": "受測者",',
                  '    "row": 2,',
                  '    "identifier": "student-001",',
                  '    "message": "Fixture import error"',
                  '  },',
                  '  "ExamineeImportResponseSchema": {',
                  '    "imported": 1,',
                  '    "updated": 0,',
                  '    "errors": []',
                  '  },',
              ],
          )
          PY
          node -e 'JSON.parse(require("fs").readFileSync("contracts/api-v1.json","utf8")); JSON.parse(require("fs").readFileSync("contracts/api-v1-fixtures.json","utf8"))'
          git diff --check -- contracts/api-v1.json contracts/api-v1-fixtures.json

      - name: Commit clean contract diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/api-v1.json contracts/api-v1-fixtures.json
          git commit -m "keep examinee import contract diff additive"
          git push origin HEAD:codex/50-examinee-import

      - name: Remove temporary cleanup workflow
        run: |
          git rm .github/workflows/tmp-issue50-contract-cleanup.yml
          git commit -m "remove temporary issue 50 contract cleanup workflow"
          git push origin HEAD:codex/50-examinee-import

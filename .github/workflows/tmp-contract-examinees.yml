name: Temporary examinee contract

on:
  push:
    branches:
      - codex/48-examinees

permissions:
  contents: write

jobs:
  contract:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/48-examinees
      - run: python3 scripts/tmp-add-examinee-contract.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec prettier --write contracts/api-v1.json contracts/api-v1-fixtures.json
      - name: Commit contract files only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add contracts/api-v1.json contracts/api-v1-fixtures.json
          git diff --cached --check
          git commit -m "add examinee API contract"
          git push origin HEAD:codex/48-examinees

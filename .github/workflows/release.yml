name: Release Artifact

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Validate and package release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foundation_release_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MYSQL_TEST_URL: mysql://root:root@127.0.0.1:3306/foundation_release_test
      REDIS_TEST_URL: redis://127.0.0.1:6379
      MYSQL_URL: mysql://root:root@127.0.0.1:3306/foundation_release_test
      FILE_STORAGE_ROOT: /tmp/server-foundation-release-storage
      BACKUP_ROOT: /tmp/server-foundation-release-backups
      BACKUP_REHEARSAL_CONFIRM: YES_I_UNDERSTAND_THIS_IS_DESTRUCTIVE
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install MySQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Verify source
        run: corepack pnpm verify

      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level=high

      - name: Run backing-service integration tests
        run: corepack pnpm test:integration

      - name: Resolve N-1 rollback target
        shell: bash
        run: |
          previous_tag="$(git describe --tags --match 'v*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            echo "ROLLBACK_BASE_REF=$previous_tag" >> "$GITHUB_ENV"
          else
            echo "ROLLBACK_BASE_REF=${GITHUB_SHA}^1" >> "$GITHUB_ENV"
          fi

      - name: Check N-1 application against migrated schema
        run: corepack pnpm migration:rollback-compatibility

      - name: Rehearse backup and restore
        run: corepack pnpm backup:rehearse

      - name: Resolve safe release identifier
        id: release
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            raw="pr-${PR_NUMBER}-${GITHUB_RUN_ID}"
          else
            raw="${GITHUB_REF_NAME:-run-${GITHUB_RUN_ID}}"
          fi
          release_id="$(printf '%s' "$raw" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          test -n "$release_id"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Release identifier: $release_id"

      - name: Simulate restrictive packaged file mode
        shell: bash
        run: |
          set -euo pipefail
          runtime_entrypoint="apps/api/dist/server.js"
          test -f "$runtime_entrypoint"
          chmod 0600 "$runtime_entrypoint"
          mode="$(stat -c '%a' "$runtime_entrypoint")"
          if [ "$mode" != "600" ]; then
            echo "failed to prepare restrictive packaged file mode: $runtime_entrypoint is $mode" >&2
            exit 1
          fi
          echo "Packager permission hazard prepared: $runtime_entrypoint mode=$mode"

      - name: Package release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.id }}
        run: corepack pnpm release:package

      - name: Prepare real systemd release environment
        shell: bash
        run: |
          set -euo pipefail

          test -x deploy/scripts/install-release.sh || {
            echo "install-release.sh is not executable" >&2
            exit 1
          }
          test -x deploy/scripts/rollback-release.sh || {
            echo "rollback-release.sh is not executable" >&2
            exit 1
          }

          node_bin="$(command -v node)"
          corepack_bin="$(command -v corepack)"
          if [ "$node_bin" != "/usr/bin/node" ]; then
            sudo ln -sf "$node_bin" /usr/bin/node
          fi
          if [ "$corepack_bin" != "/usr/bin/corepack" ]; then
            sudo ln -sf "$corepack_bin" /usr/bin/corepack
          fi
          /usr/bin/node --version | grep -q '^v24\.'
          sudo /usr/bin/corepack pnpm --version

          if ! id -u server-foundation >/dev/null 2>&1; then
            sudo useradd --system --home /var/lib/server-foundation --shell /usr/sbin/nologin server-foundation
          fi
          sudo install -d -m 0750 -o root -g server-foundation /etc/server-foundation

          cat > /tmp/server-foundation.env <<'EOF'
          NODE_ENV=production
          HOST=127.0.0.1
          PORT=8787
          MYSQL_URL=mysql://root:root@127.0.0.1:3306/foundation_release_test
          REDIS_URL=redis://127.0.0.1:6379
          FILE_STORAGE_ROOT=/var/lib/server-foundation/storage
          TRUST_PROXY_HEADERS=false
          FILE_CLEANUP_INTERVAL_SECONDS=300
          IDEMPOTENCY_TTL_SECONDS=86400
          SHUTDOWN_TIMEOUT_SECONDS=30
          BACKUP_ROOT=/tmp/server-foundation-release-backups
          EOF
          sudo install -m 0600 -o root -g root /tmp/server-foundation.env /etc/server-foundation/server-foundation.env
          sudo install -m 0644 deploy/systemd/server-foundation.service /etc/systemd/system/server-foundation.service
          sudo systemctl daemon-reload

      - name: Mutation 5 - move permission normalization before pnpm install
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('deploy/scripts/install-release.sh')
          text = path.read_text()
          install = 'corepack pnpm --dir "$target" install --prod --frozen-lockfile'
          chown = 'chown -R root:root "$target"'
          chmod = 'chmod -R u=rwX,go=rX "$target"'
          counts = {
              'install': text.count(install),
              'chown': text.count(chown),
              'chmod': text.count(chmod),
          }
          if counts != {'install': 1, 'chown': 1, 'chmod': 1}:
              raise SystemExit(f'MUTATION_5_PRECONDITION expected exactly 1 each, found {counts}')
          text = text.replace(chown + '\n', '', 1)
          text = text.replace(chmod + '\n', '', 1)
          text = text.replace(install, chown + '\n' + chmod + '\n' + install, 1)
          path.write_text(text)
          print('MUTATION_5_APPLIED exactly 1 install/chown/chmod target')
          PY

      - name: Install packaged release through production path
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          archive="release/server-foundation-${RELEASE_ID}.tar.gz"
          test -f "$archive"
          if ! sudo bash -c 'umask 077; SERVER_FOUNDATION_HEALTH_URL="$1" "$2" "$3" "$4"' _ \
            http://127.0.0.1:8787/health/ready \
            ./deploy/scripts/install-release.sh "$archive" "$RELEASE_ID"; then
            sudo systemctl status server-foundation --no-pager || true
            sudo journalctl -u server-foundation --no-pager -n 80 || true
            exit 1
          fi

          sudo systemctl is-active --quiet server-foundation
          curl -fsS http://127.0.0.1:8787/health/ready >/dev/null
          expected="/opt/server-foundation/releases/${RELEASE_ID}"
          actual="$(sudo readlink -f /opt/server-foundation/current)"
          if [ "$actual" != "$expected" ]; then
            echo "current symlink mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

          migration_count="$(mysql --batch --skip-column-names \
            --protocol=TCP -h 127.0.0.1 -uroot -proot foundation_release_test \
            -e 'SELECT COUNT(*) FROM schema_migrations')"
          if [ "$migration_count" -lt 5 ]; then
            echo "migration gate expected at least 5 applied migrations, got $migration_count" >&2
            exit 1
          fi
          echo "Release path healthy; applied migrations: $migration_count"

      - name: Install same package as a second release
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          archive="release/server-foundation-${RELEASE_ID}.tar.gz"
          second_release_id="${RELEASE_ID}-next"
          if ! sudo bash -c 'umask 077; SERVER_FOUNDATION_HEALTH_URL="$1" "$2" "$3" "$4"' _ \
            http://127.0.0.1:8787/health/ready \
            ./deploy/scripts/install-release.sh "$archive" "$second_release_id"; then
            sudo systemctl status server-foundation --no-pager || true
            sudo journalctl -u server-foundation --no-pager -n 80 || true
            exit 1
          fi
          sudo systemctl is-active --quiet server-foundation
          curl -fsS http://127.0.0.1:8787/health/ready >/dev/null
          expected="/opt/server-foundation/releases/${second_release_id}"
          actual="$(sudo readlink -f /opt/server-foundation/current)"
          if [ "$actual" != "$expected" ]; then
            echo "second release did not become current: expected $expected, got $actual" >&2
            exit 1
          fi
          echo "Second release healthy and current: $second_release_id"

      - name: Reject an existing release without moving current
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          archive="release/server-foundation-${RELEASE_ID}.tar.gz"
          expected_current="/opt/server-foundation/releases/${RELEASE_ID}-next"
          current_before="$(sudo readlink -f /opt/server-foundation/current)"
          if [ "$current_before" != "$expected_current" ]; then
            echo "precondition failed: expected current $expected_current, got $current_before" >&2
            exit 1
          fi

          set +e
          output="$(sudo env SERVER_FOUNDATION_HEALTH_URL=http://127.0.0.1:8787/health/ready \
            ./deploy/scripts/install-release.sh "$archive" "$RELEASE_ID" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            echo "existing release unexpectedly reinstalled successfully" >&2
            exit 1
          fi
          expected_error="release already exists: /opt/server-foundation/releases/${RELEASE_ID}"
          if ! grep -Fqx "$expected_error" <<<"$output"; then
            echo "expected named immutable-release failure: $expected_error" >&2
            exit 1
          fi
          current_after="$(sudo readlink -f /opt/server-foundation/current)"
          if [ "$current_after" != "$current_before" ]; then
            echo "current changed after rejected reinstall: before=$current_before after=$current_after" >&2
            exit 1
          fi
          sudo systemctl is-active --quiet server-foundation
          curl -fsS http://127.0.0.1:8787/health/ready >/dev/null
          echo "Existing release rejected and current remained unchanged: $current_after"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-foundation-${{ steps.release.outputs.id }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Clean up release-path systemd state
        if: always()
        shell: bash
        run: |
          sudo systemctl stop server-foundation >/dev/null 2>&1 || true
          sudo rm -f /etc/systemd/system/server-foundation.service
          sudo systemctl daemon-reload >/dev/null 2>&1 || true
          sudo rm -rf /opt/server-foundation /etc/server-foundation /var/lib/server-foundation

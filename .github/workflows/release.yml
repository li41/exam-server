name: Release Artifact

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Validate and package release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foundation_release_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MYSQL_TEST_URL: mysql://root:root@127.0.0.1:3306/foundation_release_test
      REDIS_TEST_URL: redis://127.0.0.1:6379
      MYSQL_URL: mysql://root:root@127.0.0.1:3306/foundation_release_test
      FILE_STORAGE_ROOT: /tmp/server-foundation-release-storage
      BACKUP_ROOT: /tmp/server-foundation-release-backups
      BACKUP_REHEARSAL_CONFIRM: YES_I_UNDERSTAND_THIS_IS_DESTRUCTIVE
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Probe systemd availability on GitHub runner
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -u
          echo "PID 1: $(ps -p 1 -o comm=)"
          systemctl --version

          unit_name="codex-systemd-probe.service"
          unit_path="/etc/systemd/system/$unit_name"
          cat > /tmp/codex-systemd-probe.service <<'EOF'
          [Unit]
          Description=Codex GitHub runner systemd probe

          [Service]
          Type=simple
          ExecStart=/usr/bin/sleep infinity
          EOF

          cleanup() {
            sudo systemctl stop "$unit_name" >/dev/null 2>&1 || true
            sudo rm -f "$unit_path"
            sudo systemctl daemon-reload >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sudo install -m 0644 /tmp/codex-systemd-probe.service "$unit_path"

          set +e
          {
            sudo systemctl daemon-reload
            sudo systemctl start "$unit_name"
            sudo systemctl is-active "$unit_name"
          } 2>&1 | tee /tmp/codex-systemd-probe.log
          probe_rc=${PIPESTATUS[0]}
          set -e

          if [ "$probe_rc" -eq 0 ]; then
            echo "SYSTEMD_PROBE=available"
          else
            echo "SYSTEMD_PROBE=unavailable"
            echo "systemd probe exit code: $probe_rc"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install MySQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Verify source
        run: corepack pnpm verify

      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level=high

      - name: Run backing-service integration tests
        run: corepack pnpm test:integration

      - name: Resolve N-1 rollback target
        shell: bash
        run: |
          previous_tag="$(git describe --tags --match 'v*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            echo "ROLLBACK_BASE_REF=$previous_tag" >> "$GITHUB_ENV"
          else
            echo "ROLLBACK_BASE_REF=${GITHUB_SHA}^1" >> "$GITHUB_ENV"
          fi

      - name: Check N-1 application against migrated schema
        run: corepack pnpm migration:rollback-compatibility

      - name: Rehearse backup and restore
        run: corepack pnpm backup:rehearse

      - name: Package release
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: corepack pnpm release:package

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-foundation-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

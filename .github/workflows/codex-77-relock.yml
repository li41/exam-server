name: Codex 77 Relock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'codex/77-relock-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Normalize generated lockfile with repo Prettier and revalidate frozen resolution
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin agent/77-deps-relock
          git checkout -B agent/77-deps-relock origin/agent/77-deps-relock
          before_sha="$(git rev-parse HEAD)"
          echo "Input dependency commit: ${before_sha}"

          repo_pnpm="$(node -e "const p=require('./package.json'); console.log(p.packageManager.split('@')[1])")"
          echo "Repo packageManager pin: pnpm@${repo_pnpm}"
          test "${repo_pnpm}" = "11.22.0"

          corepack enable
          corepack prepare "pnpm@${repo_pnpm}" --activate
          actual_pnpm="$(corepack pnpm --version)"
          echo "Validation pnpm: ${actual_pnpm}"
          test "${actual_pnpm}" = "${repo_pnpm}"

          corepack pnpm install --frozen-lockfile
          echo "Formatting only pnpm-lock.yaml with the repo-pinned Prettier dependency."
          corepack pnpm exec prettier --write pnpm-lock.yaml
          corepack pnpm exec prettier --check pnpm-lock.yaml
          corepack pnpm install --frozen-lockfile

          echo "All pnpm@11.* occurrences:"
          git grep -n 'pnpm@11\.' | tee /tmp/pnpm-pins.txt
          pin_count="$(wc -l < /tmp/pnpm-pins.txt | tr -d ' ')"
          echo "pnpm@11.* count: ${pin_count}"
          test "${pin_count}" = "8"
          if grep -v 'pnpm@11\.22\.0' /tmp/pnpm-pins.txt; then
            echo "Found pnpm@11.* pin not equal to 11.22.0" >&2
            exit 1
          fi

          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          printf '%s\n' "$changed" | grep -q '^ M pnpm-lock.yaml$'

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m "style: normalize regenerated pnpm lockfile"
          git push origin HEAD:refs/heads/agent/77-deps-relock

          {
            echo '## #77 lockfile normalization evidence'
            echo
            echo "- Input dependency commit: \`${before_sha}\`"
            echo "- pnpm validation: \`${actual_pnpm}\` from root \`packageManager\`"
            echo '- Formatting: repo Prettier applied only to `pnpm-lock.yaml`.'
            echo '- Frozen install passed both before and after formatting.'
            echo "- Full-tree \`pnpm@11.*\` occurrences: \`${pin_count}\`, all \`11.22.0\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Codex 77 Relock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  relock:
    if: github.head_ref == 'codex/77-relock-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve latest versions and regenerate pnpm-lock.yaml with repo-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout -B agent/77-deps-relock origin/main
          base_sha="$(git rev-parse HEAD)"
          echo "Base main: ${base_sha}"

          repo_pnpm="$(node -e "const p=require('./package.json'); console.log(p.packageManager.split('@')[1])")"
          echo "Repo packageManager pin: pnpm@${repo_pnpm}"
          test "${repo_pnpm}" = "11.22.0"

          corepack enable
          corepack prepare "pnpm@${repo_pnpm}" --activate
          actual_pnpm="$(corepack pnpm --version)"
          echo "Generator pnpm: ${actual_pnpm}"
          test "${actual_pnpm}" = "${repo_pnpm}"

          export TSX_LATEST="$(npm view tsx version)"
          export MYSQL2_LATEST="$(npm view mysql2 version)"
          export OXLINT_LATEST="$(npm view oxlint version)"

          echo "npm view tsx version    => ${TSX_LATEST}"
          echo "npm view mysql2 version => ${MYSQL2_LATEST}"
          echo "npm view oxlint version => ${OXLINT_LATEST}"

          node <<'NODE'
          const fs = require('fs');

          function read(path) {
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          }
          function write(path, value) {
            fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          }

          const root = read('package.json');
          root.devDependencies.oxlint = `^${process.env.OXLINT_LATEST}`;
          write('package.json', root);

          const api = read('apps/api/package.json');
          api.devDependencies.tsx = `^${process.env.TSX_LATEST}`;
          write('apps/api/package.json', api);

          const mysql = read('packages/adapters/mysql/package.json');
          mysql.dependencies.mysql2 = `^${process.env.MYSQL2_LATEST}`;
          write('packages/adapters/mysql/package.json', mysql);
          NODE

          echo "Regenerating lockfile with pnpm ${actual_pnpm} (no manual merge/edit)."
          corepack pnpm install --lockfile-only
          corepack pnpm install --frozen-lockfile

          echo "All pnpm@11.* occurrences:"
          git grep -n 'pnpm@11\.' | tee /tmp/pnpm-pins.txt
          pin_count="$(wc -l < /tmp/pnpm-pins.txt | tr -d ' ')"
          echo "pnpm@11.* count: ${pin_count}"
          test "${pin_count}" = "8"
          if grep -v 'pnpm@11\.22\.0' /tmp/pnpm-pins.txt; then
            echo "Found pnpm@11.* pin not equal to 11.22.0" >&2
            exit 1
          fi

          echo "Changed files:"
          git status --short
          git diff -- package.json apps/api/package.json packages/adapters/mysql/package.json pnpm-lock.yaml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json apps/api/package.json packages/adapters/mysql/package.json pnpm-lock.yaml
          git diff --cached --check
          git commit -m "chore: relock dependency updates"
          git push origin HEAD:refs/heads/agent/77-deps-relock

          {
            echo '## #77 relock evidence'
            echo
            echo "- Base main: \`${base_sha}\`"
            echo "- Generator: \`pnpm@${actual_pnpm}\` (from root \`packageManager\`)"
            echo "- \`npm view tsx version\`: \`${TSX_LATEST}\`"
            echo "- \`npm view mysql2 version\`: \`${MYSQL2_LATEST}\`"
            echo "- \`npm view oxlint version\`: \`${OXLINT_LATEST}\`"
            echo "- Full-tree \`pnpm@11.*\` occurrences: \`${pin_count}\`, all \`11.22.0\`"
            echo '- `pnpm-lock.yaml` was generated by this step with the repo-pinned pnpm, not manually merged.'
          } >> "$GITHUB_STEP_SUMMARY"

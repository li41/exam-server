name: Temporary debug examinee integration

on:
  push:
    branches:
      - codex/48-examinees

permissions:
  contents: write

jobs:
  debug:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foundation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MYSQL_TEST_URL: mysql://root:root@127.0.0.1:3306/foundation_test
      REDIS_TEST_URL: redis://127.0.0.1:6379
      MYSQL_URL: mysql://root:root@127.0.0.1:3306/foundation_test
      FILE_STORAGE_ROOT: /tmp/server-foundation-storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/48-examinees
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
      - name: Capture integration output
        run: |
          set +e
          corepack pnpm test:integration > tmp-examinee-integration.log 2>&1
          code=$?
          echo "$code" > tmp-examinee-integration-exit-code
          exit 0
      - name: Commit integration failure log
        run: |
          code=$(cat tmp-examinee-integration-exit-code)
          if [ "$code" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tmp-examinee-integration.log
            git commit -m "capture examinee integration failure"
            git push origin HEAD:codex/48-examinees
          fi
          exit "$code"

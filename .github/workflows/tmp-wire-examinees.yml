name: Temporary wire examinees

on:
  push:
    branches:
      - codex/48-examinees

permissions:
  contents: write

jobs:
  wire:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/48-examinees
      - run: python3 scripts/tmp-wire-examinees.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec prettier --write \
            packages/adapters/mysql/src/migrate.ts \
            apps/api/src/config.ts \
            deploy/env/server-foundation.env.example \
            apps/api/src/question-bank-routes.ts \
            apps/api/src/server.ts
      - name: Commit exact wiring files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/adapters/mysql/src/migrate.ts \
            apps/api/src/config.ts \
            deploy/env/server-foundation.env.example \
            apps/api/src/question-bank-routes.ts \
            apps/api/src/server.ts
          git diff --cached --check
          git commit -m "wire examinee API"
          git push origin HEAD:codex/48-examinees

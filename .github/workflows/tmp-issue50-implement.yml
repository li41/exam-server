name: tmp issue 50 implementation

on:
  push:
    branches:
      - codex/50-examinee-import

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'add temporary issue 50 implementation workflow'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/50-examinee-import
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply implementation patch
        run: python3 .github/tmp-issue50-implement.py

      - name: Format changed artifacts
        run: |
          corepack pnpm exec prettier --write \
            apps/api/src/examinee-import.ts \
            apps/api/src/examinee-import-handler.ts \
            apps/api/src/question-bank-routes.ts \
            apps/api/test/examinee-import.test.ts \
            packages/api-contracts/src/examinees.ts \
            packages/domain/src/ports/examinee-repository.ts \
            packages/domain/src/use-cases/examinees.ts \
            packages/adapters/mysql/src/examinee-repository.ts \
            packages/adapters/mysql/test/examinee-import-repository.integration.test.ts \
            packages/testing/src/fake-examinee-repository.ts \
            contracts/api-v1.json \
            contracts/api-v1-fixtures.json \
            doc/examinee-import-php-mapping.md

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: API tests
        run: corepack pnpm --filter @server-foundation/api test

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/examinee-import.ts \
            apps/api/src/examinee-import-handler.ts \
            apps/api/src/question-bank-routes.ts \
            apps/api/test/examinee-import.test.ts \
            packages/api-contracts/src/examinees.ts \
            packages/domain/src/ports/examinee-repository.ts \
            packages/domain/src/use-cases/examinees.ts \
            packages/adapters/mysql/src/examinee-repository.ts \
            packages/adapters/mysql/test/examinee-import-repository.integration.test.ts \
            packages/testing/src/fake-examinee-repository.ts \
            contracts/api-v1.json \
            contracts/api-v1-fixtures.json \
            doc/examinee-import-php-mapping.md
          git diff --cached --check
          git commit -m "implement examinee spreadsheet import"
          git push origin HEAD:codex/50-examinee-import

      - name: Remove temporary implementation files
        run: |
          git rm .github/tmp-issue50-implement.py .github/workflows/tmp-issue50-implement.yml
          git commit -m "remove temporary issue 50 implementation workflow"
          git push origin HEAD:codex/50-examinee-import

name: Temporary register import contract

on:
  push:
    branches:
      - codex/44-question-import

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/44-question-import
      - name: Register versioned import endpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('contracts/api-v1.json')
          s = p.read_text()
          marker = '''    {\n      "method": "GET",\n      "path": "/api/v1/question-clusters",\n      "authenticated": true,\n      "idempotent": false\n    },'''
          insert = '''    {\n      "method": "GET",\n      "path": "/api/v1/question-import/template",\n      "authenticated": true,\n      "idempotent": false\n    },\n    {\n      "method": "POST",\n      "path": "/api/v1/question-import",\n      "authenticated": true,\n      "idempotent": true\n    },\n''' + marker
          if s.count(marker) != 1:
              raise SystemExit('contract insertion marker mismatch')
          p.write_text(s.replace(marker, insert, 1))
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec prettier --write contracts/api-v1.json
      - name: Commit contract only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add contracts/api-v1.json
          git diff --cached --check
          git commit -m "register question import API contract"
          git push origin HEAD:codex/44-question-import

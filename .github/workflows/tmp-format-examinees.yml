name: Temporary format examinees

on:
  push:
    branches:
      - codex/48-examinees

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/48-examinees
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec prettier --write \
            packages/api-contracts/src/examinees.ts \
            packages/api-contracts/src/index.ts \
            packages/domain/src/ports/examinee-repository.ts \
            packages/domain/src/use-cases/examinees.ts \
            packages/domain/src/index.ts \
            packages/adapters/mysql/src/examinee-credential-protector.ts \
            packages/adapters/mysql/src/examinee-repository.ts \
            packages/adapters/mysql/src/index.ts \
            packages/testing/src/fake-examinee-repository.ts \
            packages/testing/src/index.ts \
            packages/adapters/mysql/test/examinee-credential-protector.test.ts \
            packages/adapters/mysql/test/examinee-repository.integration.test.ts \
            apps/api/test/examinees.test.ts \
            apps/api/test/config.test.ts \
            doc/examinees-php-mapping.md
      - name: Commit formatted implementation files only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/api-contracts/src/examinees.ts \
            packages/api-contracts/src/index.ts \
            packages/domain/src/ports/examinee-repository.ts \
            packages/domain/src/use-cases/examinees.ts \
            packages/domain/src/index.ts \
            packages/adapters/mysql/src/examinee-credential-protector.ts \
            packages/adapters/mysql/src/examinee-repository.ts \
            packages/adapters/mysql/src/index.ts \
            packages/testing/src/fake-examinee-repository.ts \
            packages/testing/src/index.ts \
            packages/adapters/mysql/test/examinee-credential-protector.test.ts \
            packages/adapters/mysql/test/examinee-repository.integration.test.ts \
            apps/api/test/examinees.test.ts \
            apps/api/test/config.test.ts \
            doc/examinees-php-mapping.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "format examinee implementation"
          git push origin HEAD:codex/48-examinees

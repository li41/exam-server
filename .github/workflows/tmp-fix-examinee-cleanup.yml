name: Temporary fix examinee cleanup

on:
  push:
    branches:
      - codex/48-examinees

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/48-examinees
      - name: Apply deterministic child-before-parent cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/adapters/mysql/test/examinee-repository.integration.test.ts')
          text = path.read_text()
          old = '''    await pool.execute(
              "DELETE FROM examinee_groups WHERE tenant_id IN (?, ?)",
              [scope.tenantId, otherScope.tenantId],
            );'''.replace('            ', '')
          new = '''    await pool.execute(
              "DELETE FROM examinee_groups WHERE tenant_id IN (?, ?) AND parent_id IS NOT NULL",
              [scope.tenantId, otherScope.tenantId],
            );
            await pool.execute(
              "DELETE FROM examinee_groups WHERE tenant_id IN (?, ?) AND parent_id IS NULL",
              [scope.tenantId, otherScope.tenantId],
            );'''.replace('            ', '')
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected cleanup marker twice, got {count}')
          path.write_text(text.replace(old, new))
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec prettier --write packages/adapters/mysql/test/examinee-repository.integration.test.ts
      - name: Commit test cleanup only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/adapters/mysql/test/examinee-repository.integration.test.ts
          git diff --cached --check
          git commit -m "fix examinee integration cleanup order"
          git push origin HEAD:codex/48-examinees

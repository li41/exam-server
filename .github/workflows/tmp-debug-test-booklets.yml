name: Temporary debug test booklets

on:
  push:
    branches:
      - codex/45-test-booklets

permissions:
  contents: write

jobs:
  debug:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/45-test-booklets
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
      - name: Capture verify output
        run: |
          set +e
          corepack pnpm verify > tmp-test-booklets-verify.log 2>&1
          code=$?
          echo "$code" > tmp-test-booklets-exit-code
          exit 0
      - name: Commit failure log
        run: |
          code=$(cat tmp-test-booklets-exit-code)
          if [ "$code" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tmp-test-booklets-verify.log
            git commit -m "capture test booklet verify failure"
            git push origin HEAD:codex/45-test-booklets
          fi
          exit "$code"

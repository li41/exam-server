name: Temporary question import MySQL integration

on:
  push:
    branches:
      - codex/44-question-import

permissions:
  contents: read

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foundation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MYSQL_TEST_URL: mysql://root:root@127.0.0.1:3306/foundation_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/44-question-import
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - name: Run MySQL integration tests
        run: corepack pnpm --filter @server-foundation/mysql-adapter test:integration
      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level=high

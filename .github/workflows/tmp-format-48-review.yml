name: Temporary format issue 48 review tests

on:
  push:
    branches:
      - codex/48-examinees

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/48-examinees
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          corepack pnpm install --frozen-lockfile
      - name: Format changed review test
        run: corepack pnpm exec prettier --write packages/adapters/mysql/test/examinee-repository.integration.test.ts
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- packages/adapters/mysql/test/examinee-repository.integration.test.ts; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add packages/adapters/mysql/test/examinee-repository.integration.test.ts
            git diff --cached --check
            git commit -m "format examinee tenant isolation tests"
            git push origin HEAD:codex/48-examinees
          fi

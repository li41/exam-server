name: Codex 73 Workflow Pin Copy

on:
  push:
    branches:
      - codex/73-workflow-pin-stage
    paths:
      - .github/workflows/codex-73-pin-copy.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create exact workflow pin blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sed 's/pnpm@11\.10\.0/pnpm@11.22.0/g' .github/workflows/verify.yml > /tmp/codex-73-verify.yml
          sed 's/pnpm@11\.10\.0/pnpm@11.22.0/g' .github/workflows/release.yml > /tmp/codex-73-release.yml

          if grep -n 'pnpm@11\.10\.0' /tmp/codex-73-verify.yml /tmp/codex-73-release.yml; then
            echo 'stale pnpm pin remains in staged workflow blob' >&2
            exit 1
          fi

          grep -n 'pnpm@11\.22\.0' /tmp/codex-73-verify.yml /tmp/codex-73-release.yml
          git diff --no-index -- .github/workflows/verify.yml /tmp/codex-73-verify.yml || true
          git diff --no-index -- .github/workflows/release.yml /tmp/codex-73-release.yml || true

          create_blob() {
            file="$1"
            payload="$(jq -n --rawfile content "$file" '{content:$content,encoding:"utf-8"}')"
            curl -fsS \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              https://api.github.com/repos/li41/exam-server/git/blobs \
              -d "$payload" | jq -r '.sha'
          }

          verify_sha="$(create_blob /tmp/codex-73-verify.yml)"
          release_sha="$(create_blob /tmp/codex-73-release.yml)"
          test -n "$verify_sha"
          test -n "$release_sha"
          echo "VERIFY_BLOB_SHA=$verify_sha"
          echo "RELEASE_BLOB_SHA=$release_sha"

name: tmp issue 50 validation

on:
  push:
    branches:
      - codex/50-examinee-import

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'add temporary issue 50 validation workflow'
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foundation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_TEST_URL: mysql://root:root@127.0.0.1:3306/foundation_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/50-examinee-import
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Full verify
        run: corepack pnpm verify

      - name: Production dependency audit
        run: corepack pnpm audit --prod --audit-level=high

      - name: MySQL integration pass 1
        run: corepack pnpm test:integration:mysql

      - name: MySQL integration pass 2 on same database
        run: corepack pnpm test:integration:mysql

      - name: Remove temporary validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-issue50-validate.yml
          git commit -m "remove temporary issue 50 validation workflow"
          git push origin HEAD:codex/50-examinee-import
